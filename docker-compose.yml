# Full stack — reuse local images only (pull_policy: never)
# Bases: postgres:16-alpine, node:22-alpine
#
#   powershell -File scripts/docker-up.ps1
#   docker compose up -d --pull never

services:
  postgres:
    image: postgres:16-alpine
    pull_policy: never
    environment:
      POSTGRES_USER: syntaxia
      POSTGRES_PASSWORD: syntaxia
      POSTGRES_DB: syntaxia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./apps/api/migrations/002_sandbox_harden.sql:/docker-entrypoint-initdb.d/02-sandbox.sql:ro
      - ./apps/api/migrations/014_language_review_fsrs.sql:/docker-entrypoint-initdb.d/03-language-review.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syntaxia -d syntaxia"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:22-alpine
    pull_policy: never
    working_dir: /app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_PORT: "8080"
      # Inside Docker network use service hostname, not localhost from .env
      DATABASE_URL: postgres://syntaxia:syntaxia@postgres:5432/syntaxia?sslmode=disable
      SANDBOX_DATABASE_URL: postgres://syntaxia_sandbox:syntaxia_sandbox@postgres:5432/syntaxia?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      CURRICULUM_LOCAL_PATH: /app/curriculum
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3001}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8082/api/v1/auth/google/callback}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_DRIVE_CREDENTIALS_FILE: ${GOOGLE_DRIVE_CREDENTIALS_FILE:-}
    volumes:
      - ./apps/api/bin/server-linux:/app/server:ro
      - ./docs/curriculum:/app/curriculum:ro
    command: ["sh", "-c", "cp /app/server /tmp/server && chmod +x /tmp/server && exec /tmp/server"]
    ports:
      - "${SYNTAXIA_API_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 8s

  web:
    image: node:22-alpine
    pull_policy: never
    working_dir: /app
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8082}
      HOST: "0.0.0.0"
      PORT: "3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "${SYNTAXIA_WEB_PORT:-3001}:3000"

volumes:
  postgres_data:
  web_node_modules:
