name: Product CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  curriculum:
    name: Curriculum · structure and parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify SQL Fundamentals
        run: node scripts/verify-sql-fundamentals.mjs
      - name: Verify PostgreSQL
        run: node scripts/verify-postgresql-v2.mjs
      - name: Verify JavaScript
        run: node scripts/verify-javascript-v2.mjs
      - name: Verify HTML
        run: node scripts/verify-html-v2.mjs
      - name: Verify CSS
        run: node scripts/verify-css-v2.mjs

  api:
    name: API · Go verify, test and vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum
      - name: Verify committed module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify module checksums
        run: go mod verify
      - name: Unit tests
        # Some drive package smoke tests intentionally read docs/curriculum,
        # which is outside the Go package cache key. Run tests cold so content
        # changes can never reuse a stale cached result.
        run: go test -count=1 -mod=readonly ./...
      - name: Vet
        run: go vet -mod=readonly ./...

  web:
    name: Web · build and regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Resolve patched dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Refresh transitive dependencies
        run: npm update --package-lock-only --ignore-scripts
      - name: Upload remediated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: remediated-web-lock
          path: apps/web/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
      - name: Product flow, shell and UI regression
        run: |
          npm run test:product-flows
          npm run test:learning-path
          npm run test:shell-ux
          npm run test:ui-refresh
          npm run test:ui-system
          npm run test:e2e-suite
          npm run test:release-contract
      - name: Language V3 contracts
        run: |
          npm run test:language-v3
          npm run test:language-path-v2
          npm run test:language-audio
          npm run test:language-review
      - name: i18n parity
        run: npm run test:i18n
      - name: Existing audit regression
        run: npm run test:audit-remediation

  e2e:
    name: Release · DB-backed E2E and learning persistence
    needs: [curriculum, api, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syntaxia
          POSTGRES_PASSWORD: syntaxia
          POSTGRES_DB: syntaxia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syntaxia -d syntaxia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://syntaxia:syntaxia@127.0.0.1:5432/syntaxia?sslmode=disable
      SANDBOX_DATABASE_URL: postgres://syntaxia_sandbox:syntaxia_sandbox@127.0.0.1:5432/syntaxia?sslmode=disable
      JWT_SECRET: product-ci-secret-not-for-production
      API_PORT: "8082"
      CORS_ORIGINS: http://127.0.0.1:3001,http://localhost:3001
      WEB_BASE_URL: http://127.0.0.1:3001
      CURRICULUM_LOCAL_PATH: ../../docs/curriculum
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum
      - name: Initialize release-test database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/migrations/init.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/migrations/002_sandbox_harden.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/migrations/014_language_review_fsrs.sql
          # Simulate a long-lived production DB that was created when only the
          # first language track existed. API startup must recreate later
          # app-owned tracks before curriculum sync or their lessons hit the FK.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM tracks WHERE id IN ('english-basics','japanese-jlpt','chinese-it-vocab');"
      - name: Start API with local curriculum
        run: |
          cd apps/api
          nohup go run ./cmd/server > "$RUNNER_TEMP/syntaxia-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/syntaxia-api.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8082/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/syntaxia-api.log"
          exit 1
      - name: Run full cross-domain E2E and sandboxes
        shell: pwsh
        run: ./scripts/e2e-all.ps1 -BaseUrl http://127.0.0.1:8082 -IncludeSandboxes
      - name: Verify persisted FSRS rows
        run: |
          cards=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM language_review_cards")
          logs=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM language_review_logs")
          echo "language_review_cards=$cards"
          echo "language_review_logs=$logs"
          test "$cards" -ge 4
          test "$logs" -ge 5
      - name: Show API log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/syntaxia-api.log" || true
