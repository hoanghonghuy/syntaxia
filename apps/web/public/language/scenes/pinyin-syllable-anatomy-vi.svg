<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">Cấu tạo âm tiết Pinyin</title>
  <desc id="desc">Âm tiết nǐ được tách thành thanh mẫu n, vận mẫu i và thanh 3.</desc>
  <rect width="640" height="320" rx="28" fill="#f5f7f6"/>
  <text x="320" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="42" font-weight="700" fill="#17201c">nǐ</text>
  <path d="M320 88v38" stroke="#61716a" stroke-width="4" stroke-linecap="round"/>
  <rect x="58" y="142" width="154" height="92" rx="18" fill="#d8eee8"/>
  <rect x="243" y="142" width="154" height="92" rx="18" fill="#e8ecea"/>
  <rect x="428" y="142" width="154" height="92" rx="18" fill="#dce6f4"/>
  <text x="135" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#17201c">thanh mẫu</text>
  <text x="135" y="216" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30" fill="#17201c">n</text>
  <text x="320" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#17201c">vận mẫu</text>
  <text x="320" y="216" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30" fill="#17201c">i</text>
  <text x="505" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#17201c">thanh điệu</text>
  <text x="505" y="216" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30" fill="#17201c">ˇ  3</text>
  <path d="M212 188h28M397 188h28" stroke="#61716a" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="282" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#56645e">các phần âm + thanh điệu → một âm tiết tiếng Trung</text>
</svg>
