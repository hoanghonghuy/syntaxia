<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">English word stress beats</title>
  <desc id="desc">A beat diagram comparing stronger stressed syllables with weaker unstressed syllables in familiar beginner words.</desc>
  <rect width="720" height="360" rx="28" fill="#f8f8fc"/>
  <text x="360" y="64" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" font-weight="750" fill="#20263a">Hear the strong beat</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <circle cx="175" cy="150" r="48" fill="#4f46e5"/>
    <circle cx="275" cy="150" r="30" fill="#dfe2f2"/>
    <text x="175" y="158" font-size="24" font-weight="800" fill="#fff">TA</text>
    <text x="275" y="158" font-size="20" font-weight="700" fill="#3d455c">ble</text>
    <text x="225" y="225" font-size="22" font-weight="700" fill="#20263a">TA-ble</text>

    <circle cx="455" cy="150" r="48" fill="#4f46e5"/>
    <circle cx="555" cy="150" r="30" fill="#dfe2f2"/>
    <text x="455" y="158" font-size="24" font-weight="800" fill="#fff">WA</text>
    <text x="555" y="158" font-size="20" font-weight="700" fill="#3d455c">ter</text>
    <text x="505" y="225" font-size="22" font-weight="700" fill="#20263a">WA-ter</text>
  </g>
  <path d="M128 285h464" stroke="#c4c9dc" stroke-width="4" stroke-linecap="round"/>
  <text x="360" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#59617a">One syllable carries the clearest beat.</text>
</svg>