<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">English sound and spelling</title>
  <desc id="desc">The written word meet points to the sounds m, long ee, and t, showing that letters and sounds are related but not identical.</desc>
  <rect width="720" height="420" rx="32" fill="#f8fafc"/>
  <rect x="70" y="92" width="220" height="112" rx="24" fill="#eef2ff" stroke="#6366f1" stroke-width="4"/>
  <text x="180" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="52" font-weight="700" fill="#1f2937">meet</text>
  <path d="M300 148 H420" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
  <path d="M405 132 L428 148 L405 164" fill="none" stroke="#6366f1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="438" y="92" width="210" height="112" rx="24" fill="#ecfdf5" stroke="#10b981" stroke-width="4"/>
  <text x="543" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="42" font-weight="700" fill="#1f2937">/m iː t/</text>
  <text x="360" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" font-weight="650" fill="#475569">spelling helps you find the word</text>
  <text x="360" y="312" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" font-weight="650" fill="#475569">sound tells you how to say it</text>
  <text x="360" y="366" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#64748b">IPA is a reference tool, not another alphabet to memorise first.</text>
</svg>