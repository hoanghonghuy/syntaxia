<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">Mandarin tone ladder</title>
  <desc id="desc">Five panels show first, second, third, fourth and neutral tone contours with example Pinyin.</desc>
  <rect width="640" height="320" rx="28" fill="#f5f7f6"/>
  <g font-family="system-ui,sans-serif" fill="#17201c" text-anchor="middle">
    <text x="320" y="42" font-size="24" font-weight="700">Mandarin tones</text>
    <g transform="translate(24 70)">
      <rect width="108" height="190" rx="16" fill="#e1efeb"/><text x="54" y="32" font-size="18" font-weight="700">1 · mā</text><path d="M20 84h68" stroke="#147d6f" stroke-width="7" stroke-linecap="round"/><text x="54" y="156" font-size="15">high · level</text>
    </g>
    <g transform="translate(145 70)">
      <rect width="108" height="190" rx="16" fill="#e8ecea"/><text x="54" y="32" font-size="18" font-weight="700">2 · má</text><path d="M20 108L88 70" stroke="#506b62" stroke-width="7" stroke-linecap="round"/><text x="54" y="156" font-size="15">rising</text>
    </g>
    <g transform="translate(266 70)">
      <rect width="108" height="190" rx="16" fill="#e5eaf3"/><text x="54" y="32" font-size="18" font-weight="700">3 · mǎ</text><path d="M18 78Q54 130 90 82" stroke="#516d9a" stroke-width="7" fill="none" stroke-linecap="round"/><text x="54" y="156" font-size="15">low · dipping</text>
    </g>
    <g transform="translate(387 70)">
      <rect width="108" height="190" rx="16" fill="#eee8e5"/><text x="54" y="32" font-size="18" font-weight="700">4 · mà</text><path d="M20 68L88 116" stroke="#8b6251" stroke-width="7" stroke-linecap="round"/><text x="54" y="156" font-size="15">falling</text>
    </g>
    <g transform="translate(508 70)">
      <rect width="108" height="190" rx="16" fill="#ecebea"/><text x="54" y="32" font-size="18" font-weight="700">0 · ma</text><path d="M42 92h24" stroke="#727876" stroke-width="7" stroke-linecap="round"/><text x="54" y="156" font-size="15">light · neutral</text>
    </g>
    <text x="320" y="292" font-size="17" fill="#56645e">The tone belongs to the syllable; neutral tone is written without a mark.</text>
  </g>
</svg>
